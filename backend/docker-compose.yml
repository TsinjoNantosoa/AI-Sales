services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_sales
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    # Pinned stable release matching n8n/manifest.json targetN8nVersion
    image: n8nio/n8n:2.32.6
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # Public webhook URL (ngrok in dev, real domain in prod) — set at runtime, never hardcoded
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Europe/Paris}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key-32-chars}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Required by workflow pack: allow $env access in Code / HTTP Request nodes
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Give the internal JavaScript task runner enough time on Windows/Docker startup.
      N8N_RUNNERS_GRANT_TOKEN_TTL: "120"
      # Backend reachable inside Docker network
      AI_SALES_BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      # Shared inbound webhook secret — workflows verify X-N8N-Webhook-Key
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-dev-n8n-webhook-secret}
      # n8n → FastAPI service auth
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-api-key}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Copy .env.example → .env and fill in your secrets before running
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_sales
      DATABASE_URL_SYNC: postgresql+psycopg://postgres:postgres@postgres:5432/ai_sales
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      # n8n is always enabled when running the full Docker stack
      N8N_ENABLED: "true"
      N8N_BASE_URL: http://n8n:5678
      BACKEND_INTERNAL_URL: http://backend:8000
      SEED_ON_STARTUP: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    command:
      - sh
      - -c
      - |
        python scripts/wait_for_db.py &&
        alembic upgrade head &&
        if [ "$$SEED_ON_STARTUP" = "true" ]; then python scripts/seed.py; fi &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_sales
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      N8N_ENABLED: "true"
      N8N_BASE_URL: http://n8n:5678
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.tasks.WorkerSettings

volumes:
  pgdata:
  n8n_pgdata:
  n8n_data:
