[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-sales-assistant-api"
version = "1.0.0"
description = "Backend API for AI Sales Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic[email]>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "structlog>=24.4.0",
  "python-jose[cryptography]>=3.3.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=43.0.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
  "orjson>=3.10.0",
  "arq>=0.26.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "bandit>=1.8.0",
  "types-redis>=4.6.0",
  "factory-boy>=3.3.0",
  "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
# E501: long lines in SQLAlchemy/models; E741: `lead` often abbreviated;
# N803: FastAPI Query aliases use camelCase (leadId, userId) for frontend.
ignore = ["B008", "N818", "E501", "E741", "N803", "N806", "ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/agents/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
