name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_sales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: test
      RATE_LIMIT_ENABLED: "false"
      JWT_SECRET_KEY: test-secret-key-at-least-32-characters-long
      ENCRYPTION_KEY: test-encryption-key-32-bytes-long!
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_sales_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_sales_test
      REDIS_URL: redis://localhost:6379/0
      AI_MOCK_MODE: "true"
      EMAIL_MOCK_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app scripts
      - name: Mypy
        run: mypy app
      - name: Bandit
        run: bandit -r app -ll
      - name: Pytest
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Docker build
        run: docker build -t ai-sales-api:ci .
